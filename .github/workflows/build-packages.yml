name: Build packages

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    name: AppImage (aarch64)
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30

    steps:
      - name: Check out the source
        uses: actions/checkout@v6

      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            dpkg-dev \
            file \
            libcurl4-openssl-dev \
            libgirepository1.0-dev \
            libgpgme-dev \
            libgtk-3-dev \
            libhandy-1-dev \
            libjson-glib-dev \
            librsvg2-dev \
            pkg-config \
            texinfo

      - name: Build and test the Linux app
        run: |
          make --jobs="$(nproc)"
          make test

      - name: Stage the AppDir
        run: make install DESTDIR="$PWD/AppDir" PREFIX=/usr

      - name: Build the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: aarch64
          DEPLOY_GTK_VERSION: "3"
          VERSION: "0.1"
        run: |
          tools_dir="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools_dir" dist

          curl --fail --location --retry 3 \
            --output "$tools_dir/linuxdeploy-aarch64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-aarch64.AppImage
          curl --fail --location --retry 3 \
            --output "$tools_dir/linuxdeploy-plugin-gtk.sh" \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/7a3fbc31a9e5075073ff8790f26effbac5f84453/linuxdeploy-plugin-gtk.sh
          chmod +x \
            "$tools_dir/linuxdeploy-aarch64.AppImage" \
            "$tools_dir/linuxdeploy-plugin-gtk.sh"

          export PATH="$tools_dir:$PATH"
          export OUTPUT="$PWD/dist/tweeta-mobile-aarch64.AppImage"
          "$tools_dir/linuxdeploy-aarch64.AppImage" \
            --appdir "$PWD/AppDir" \
            --plugin gtk \
            --output appimage \
            --desktop-file "$PWD/tweeta-mobile.desktop" \
            --icon-file "$PWD/logo.png"

          test -s "$OUTPUT"
          chmod +x "$OUTPUT"

      - name: Upload the AppImage
        uses: actions/upload-artifact@v7
        with:
          name: tweeta-mobile-appimage-aarch64
          path: dist/tweeta-mobile-aarch64.AppImage
          if-no-files-found: error
          archive: false

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
            dist/tweeta-mobile-release.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: tweeta-mobile-android-release
          path: dist/tweeta-mobile-release.apk
          if-no-files-found: error
          archive: false
