name: Build packages

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    name: AppImage (aarch64)
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30

    steps:
      - name: Check out the source
        uses: actions/checkout@v6

      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            dpkg-dev \
            file \
            imagemagick \
            libcurl4-openssl-dev \
            libgirepository1.0-dev \
            libgpgme-dev \
            libgtk-3-dev \
            libhandy-1-dev \
            libjson-glib-dev \
            librsvg2-dev \
            pkg-config \
            texinfo

      - name: Build and test the Linux app
        run: |
          make --jobs="$(nproc)"
          make test

      - name: Stage the AppDir
        run: make install DESTDIR="$PWD/AppDir" PREFIX=/usr

      - name: Build the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: aarch64
          DEPLOY_GTK_VERSION: "3"
          VERSION: "0.1"
        run: |
          tools_dir="$RUNNER_TEMP/linuxdeploy"
          icon_dir="$RUNNER_TEMP/tweeta-mobile-icon"
          mkdir -p "$tools_dir" "$icon_dir" dist

          convert "$PWD/logo.png" \
            -resize 384x384 \
            "$icon_dir/tweeta-mobile.png"
          identify "$icon_dir/tweeta-mobile.png" | grep --quiet '384x384'

          curl --fail --location --retry 3 \
            --output "$tools_dir/linuxdeploy-aarch64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-aarch64.AppImage
          curl --fail --location --retry 3 \
            --output "$tools_dir/linuxdeploy-plugin-gtk.sh" \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/7a3fbc31a9e5075073ff8790f26effbac5f84453/linuxdeploy-plugin-gtk.sh
          chmod +x \
            "$tools_dir/linuxdeploy-aarch64.AppImage" \
            "$tools_dir/linuxdeploy-plugin-gtk.sh"

          export PATH="$tools_dir:$PATH"
          export OUTPUT="$PWD/dist/tweeta-mobile-aarch64.AppImage"
          "$tools_dir/linuxdeploy-aarch64.AppImage" \
            --appdir "$PWD/AppDir" \
            --plugin gtk \
            --output appimage \
            --desktop-file "$PWD/tweeta-mobile.desktop" \
            --icon-file "$icon_dir/tweeta-mobile.png"

          test -s "$OUTPUT"
          chmod +x "$OUTPUT"

      - name: Upload the AppImage
        uses: actions/upload-artifact@v7
        with:
          name: tweeta-mobile-aarch64.AppImage
          path: dist/tweeta-mobile-aarch64.AppImage
          if-no-files-found: error
          archive: false

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
            dist/tweeta-mobile-release.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: tweeta-mobile-release.apk
          path: dist/tweeta-mobile-release.apk
          if-no-files-found: error
          archive: false

  ios-ipa:
    name: iOS IPA (unsigned)
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out the source
        uses: actions/checkout@v6

      - name: Verify the Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          swift --version

      - name: Install xtool
        run: |
          brew install xtool-org/tap/xtool
          xtool --version

      - name: Build the release IPA
        working-directory: iOS
        run: xtool dev build --configuration release --ipa

      - name: Collect the IPA
        run: |
          ipa_path="$(find iOS -type f -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          test -s "$ipa_path"

          mkdir -p dist
          cp "$ipa_path" dist/tweeta-mobile-unsigned.ipa
          unzip -t dist/tweeta-mobile-unsigned.ipa

      - name: Upload the IPA
        uses: actions/upload-artifact@v7
        with:
          name: tweeta-mobile-unsigned.ipa
          path: dist/tweeta-mobile-unsigned.ipa
          if-no-files-found: error
          archive: false

  release:
    name: Create GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - appimage
      - android-apk
      - ios-ipa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: master-release
      cancel-in-progress: false
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TZ: UTC

    steps:
      - name: Download the AppImage
        uses: actions/download-artifact@v8
        with:
          name: tweeta-mobile-aarch64.AppImage
          path: dist

      - name: Download the APK
        uses: actions/download-artifact@v8
        with:
          name: tweeta-mobile-release.apk
          path: dist

      - name: Download the IPA
        uses: actions/download-artifact@v8
        with:
          name: tweeta-mobile-unsigned.ipa
          path: dist

      - name: Determine the release version
        id: version
        run: |
          release_date="$(date -u +%d%m%Y)"
          next_index=0

          while IFS= read -r tag; do
            if [[ "$tag" =~ ^${release_date}\.([0-9]+)$ ]]; then
              index=$((10#${BASH_REMATCH[1]}))
              if (( index >= next_index )); then
                next_index=$((index + 1))
              fi
            fi
          done < <(gh release list --limit 1000 --json tagName --jq '.[].tagName')

          version="${release_date}.${next_index}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Creating release $version"

      - name: Create the GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -s dist/tweeta-mobile-aarch64.AppImage
          test -s dist/tweeta-mobile-release.apk
          test -s dist/tweeta-mobile-unsigned.ipa

          gh release create "$VERSION" \
            dist/tweeta-mobile-aarch64.AppImage \
            dist/tweeta-mobile-release.apk \
            dist/tweeta-mobile-unsigned.ipa \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
